# EXTRACTION

video_dir: ""       # root folder containing subfolders of .mp4 videos (one subfolder per part)
frame_save_dir: ""  # where extracted frames will be saved
csv_path: ""        # required only when video_type: "single" (no header, col0: folder name, col1: part name)

frame_rate: 0.8  # seconds per frame (0.8 = ~1.25fps)

video_type: "single"  # "single" — one part per frame, CSV mapping, filename: {part_name}-{uuid}.jpg
                      # "multi"  — multiple parts per frame, no CSV, filename: {uuid}.jpg


# AUGMENTATION

yolo_dir: ""        # input: annotated dataset directory (images/ + labels/ for Detection, class subfolders for Classification)
yolo_save_dir: ""   # output: where augmented / split / lc results will be saved

task: "Detection"  # "Detection" (main) or "Classification" (baseline comparison only)
copy: False
multiplier: 1
mixup: False    # Blend 2 images (Detection only)
mosaic: False   # Combine 4 images into 2×2 grid (Detection only)


# DEDUPLICATION
# threshold=0: exact duplicates only / threshold=5: near-duplicates (recommended)

deduplicate: True
hash_size: 8        # avg-hash grid size (8 = 64-bit hash)
hash_threshold: 5   # Hamming distance threshold


# SPLIT
# mode: "chunk" prevents adjacent-frame leakage across splits (recommended)
#       "random" shuffles individual files

split_mode: "chunk"
split_ratios: [0.7, 0.15, 0.15]  # train / val / test
split_seed: 42
chunk_size: 10  # consecutive frames per chunk (chunk mode only)


# CLASS IMBALANCE

imbalance_ratio_warn: 3.0  # warn if max:min count ratio exceeds this


# VALIDATE
# Checks data.yaml class names against Excel SVC Part Numbers,
# and scans label .txt files for out-of-range class_ids.

validate_dir: ""    # Roboflow YOLO export root (must contain data.yaml + labels/)
excel_path: ""      # path to the master parts Excel file


# LEARNING CURVE
# Creates staged subsets: stage_50/, stage_100/, ... under yolo_save_dir
#
# lc_source_dir: source dataset for lc (optional).
#   If empty → falls back to yolo_dir.
#   Set this to yolo_save_dir from the augment step to run lc on augmented data.

lc_stages: [50, 100, 150, 300]
lc_seed: 42
lc_source_dir: ""  # leave empty to use yolo_dir; set to augmented output dir if needed
